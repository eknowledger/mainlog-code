[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textpipe"
version = "1.4"
description = "A tiny host that runs text filters supplied by plugins."
requires-python = ">=3.10"
dependencies = ["packaging>=23"]

[tool.setuptools.packages.find]
where = ["src"]
