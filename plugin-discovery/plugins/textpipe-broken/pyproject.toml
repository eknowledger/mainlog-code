[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textpipe-broken"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["textpipe>=1.0"]

[project.entry-points."textpipe.filters"]
translate = "textpipe_broken:Translate"

[tool.setuptools.packages.find]
where = ["src"]
