[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textpipe-future"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["textpipe>=2.0"]

[project.entry-points."textpipe.filters"]
summarize = "textpipe_future:Summarize"

[tool.setuptools.packages.find]
where = ["src"]
