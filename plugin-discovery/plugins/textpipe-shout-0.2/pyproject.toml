[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textpipe-shout"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["textpipe>=1.0"]

[project.entry-points."textpipe.filters"]
shout = "textpipe_shout:Shout"

[tool.setuptools.packages.find]
where = ["src"]
