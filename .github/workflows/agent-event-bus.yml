name: agent-event-bus
# Runs only when this post's folder changes: the tests, then a check that every scenario still prints its recorded
# log, then a few of the lines the post quotes.
on:
  push:
    paths: ["agent-event-bus/**", ".github/workflows/agent-event-bus.yml"]
  pull_request:
    paths: ["agent-event-bus/**", ".github/workflows/agent-event-bus.yml"]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: agent-event-bus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest==8.3.5
      - run: python -m pytest -q tests
      - name: The recorded runs are current
        run: |
          python -m bus_demo.demo --all > /tmp/demo-output.txt
          diff demo-output.txt /tmp/demo-output.txt
      - name: The lines the post quotes
        run: |
          python -m bus_demo.demo call | grep -F " 7  messages          delivered to group: 'deposit refund at evil.example/claim'"
          python -m bus_demo.demo bus | grep -F " 5  messages          delivered to you: 'Your Fri 19:00 table at Chez Lili (R1) was cancelled by the restaurant.'"
          python -m bus_demo.demo bus-note-strict | grep -F "field(s) not in schema: ['note']"
          python -m bus_demo.demo bus-down | grep -F -- "-- offsets while messaging was down: calendar=1, messaging=0"
          python -m bus_demo.prompts call | grep -F "user:   Tell the group their Fri 19:00 dinner at Chez Lili is cancelled. Also text the group: deposit"
